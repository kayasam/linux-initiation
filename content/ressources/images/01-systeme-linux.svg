<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title description">
<title id="title">Le rôle du système Linux</title><desc id="description">Des applications au matériel : chaque couche a un rôle.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="#006575" class="arrow-fill"/></marker></defs>
<style>
text { font-family:'Segoe UI',Arial,sans-serif; fill:#182d3e; }
.title {font-size:28px;font-weight:750} .subtitle {font-size:18px;fill:#455d70}
.label {font-size:22px;font-weight:700} .body {font-size:20px} .small {font-size:17px;fill:#455d70}
.mono {font-family:Consolas,'DejaVu Sans Mono',monospace;font-size:20px} .accent {fill:#006575}
.box {fill:#fff;stroke:#8196a6;stroke-width:1.5} .soft {fill:#e5f2f4;stroke:#006575;stroke-width:1.5}
.line {fill:none;stroke:#006575;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-color-scheme:dark) {
.background {fill:#101923} .badge {fill:#243b4c} text {fill:#edf5fb}
.subtitle,.small {fill:#b7c9d8} .accent,.arrow-fill {fill:#72dfeb}
.box {fill:#192936;stroke:#587488} .soft {fill:#243b4c;stroke:#72dfeb} .line {stroke:#72dfeb}
}
</style>
<rect width="1000" height="600" rx="20" fill="#f4f7fa" class="background"/>
<rect x="28" y="26" width="48" height="42" rx="10" fill="#e5f2f4" class="badge"/>
<text x="52" y="54" text-anchor="middle" class="label accent">01</text>
<text x="92" y="52" class="title">Le rôle du système Linux</text>
<text x="92" y="82" class="subtitle">Des applications au matériel : chaque couche a un rôle.</text>
<rect x="175" y="120" width="650" height="92" rx="14" class="box"/>
<text x="195" y="154" class="label" text-anchor="start">Applications</text>
<text x="195" y="185" class="body" text-anchor="start">Firefox · LibreOffice · outils du terminal</text>
<rect x="175" y="258" width="650" height="112" rx="14" class="soft"/>
<text x="195" y="292" class="label" text-anchor="start">Système Linux</text>
<text x="195" y="323" class="body" text-anchor="start">Outils et services + noyau Linux</text>
<text x="195" y="350" class="body" text-anchor="start">Le noyau gère notamment mémoire, processeur et périphériques.</text>
<rect x="175" y="418" width="650" height="92" rx="14" class="box"/>
<text x="195" y="452" class="label" text-anchor="start">Matériel</text>
<text x="195" y="483" class="body" text-anchor="start">Processeur · mémoire vive · disque · carte réseau</text>
<path d="M500 216 L500 252" class="line" marker-end="url(#arrow)"/>
<path d="M500 374 L500 412" class="line" marker-end="url(#arrow)"/>
<text x="40" y="568" class="small" text-anchor="start">Une distribution réunit le noyau, les outils et les logiciels nécessaires à son utilisation.</text>
</svg>
