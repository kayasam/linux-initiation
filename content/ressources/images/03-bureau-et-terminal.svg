<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title description">
<title id="title">Deux interfaces, les mêmes fichiers</title><desc id="description">Le bureau et le terminal donnent accès au même système Linux.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="#006575" class="arrow-fill"/></marker></defs>
<style>
text { font-family:'Segoe UI',Arial,sans-serif; fill:#182d3e; }
.title {font-size:28px;font-weight:750} .subtitle {font-size:18px;fill:#455d70}
.label {font-size:22px;font-weight:700} .body {font-size:20px} .small {font-size:17px;fill:#455d70}
.mono {font-family:Consolas,'DejaVu Sans Mono',monospace;font-size:20px} .accent {fill:#006575}
.box {fill:#fff;stroke:#8196a6;stroke-width:1.5} .soft {fill:#e5f2f4;stroke:#006575;stroke-width:1.5}
.line {fill:none;stroke:#006575;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-color-scheme:dark) {
.background {fill:#101923} .badge {fill:#243b4c} text {fill:#edf5fb}
.subtitle,.small {fill:#b7c9d8} .accent,.arrow-fill {fill:#72dfeb}
.box {fill:#192936;stroke:#587488} .soft {fill:#243b4c;stroke:#72dfeb} .line {stroke:#72dfeb}
}
</style>
<rect width="1000" height="600" rx="20" fill="#f4f7fa" class="background"/>
<rect x="28" y="26" width="48" height="42" rx="10" fill="#e5f2f4" class="badge"/>
<text x="52" y="54" text-anchor="middle" class="label accent">03</text>
<text x="92" y="52" class="title">Deux interfaces, les mêmes fichiers</text>
<text x="92" y="82" class="subtitle">Le bureau et le terminal donnent accès au même système Linux.</text>
<rect x="55" y="136" width="390" height="135" rx="14" class="soft"/>
<text x="75" y="170" class="label" text-anchor="start">Interface graphique</text>
<text x="75" y="201" class="body" text-anchor="start">Fenêtres, icônes et souris</text>
<text x="75" y="228" class="body" text-anchor="start">Gestionnaire de fichiers</text>
<rect x="555" y="136" width="390" height="135" rx="14" class="soft"/>
<text x="575" y="170" class="label" text-anchor="start">Terminal</text>
<text x="575" y="201" class="body" text-anchor="start">Commandes saisies au clavier</text>
<text x="575" y="228" class="body" text-anchor="start">ls · cd · cat</text>
<rect x="235" y="365" width="530" height="123" rx="14" class="box"/>
<text x="255" y="399" class="label" text-anchor="start">Un même fichier</text>
<text x="255" y="430" class="body" text-anchor="start">/home/stagiaire/Documents/notes.txt</text>
<path d="M250 279 L380 357" class="line" marker-end="url(#arrow)"/>
<path d="M750 279 L620 357" class="line" marker-end="url(#arrow)"/>
<text x="500" y="320" class="small" text-anchor="middle">Deux façons de lire ou modifier le document</text>
<text x="40" y="568" class="small" text-anchor="start">Un document créé dans le gestionnaire de fichiers peut aussi être manipulé en ligne de commande.</text>
</svg>
