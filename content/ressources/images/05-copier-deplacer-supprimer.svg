<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title description">
<title id="title">Copier, déplacer, supprimer</title><desc id="description">Observer ce qui reste après chaque commande.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="#006575" class="arrow-fill"/></marker></defs>
<style>
text { font-family:'Segoe UI',Arial,sans-serif; fill:#182d3e; }
.title {font-size:28px;font-weight:750} .subtitle {font-size:18px;fill:#455d70}
.label {font-size:22px;font-weight:700} .body {font-size:20px} .small {font-size:17px;fill:#455d70}
.mono {font-family:Consolas,'DejaVu Sans Mono',monospace;font-size:20px} .accent {fill:#006575}
.box {fill:#fff;stroke:#8196a6;stroke-width:1.5} .soft {fill:#e5f2f4;stroke:#006575;stroke-width:1.5}
.line {fill:none;stroke:#006575;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-color-scheme:dark) {
.background {fill:#101923} .badge {fill:#243b4c} text {fill:#edf5fb}
.subtitle,.small {fill:#b7c9d8} .accent,.arrow-fill {fill:#72dfeb}
.box {fill:#192936;stroke:#587488} .soft {fill:#243b4c;stroke:#72dfeb} .line {stroke:#72dfeb}
}
</style>
<rect width="1000" height="600" rx="20" fill="#f4f7fa" class="background"/>
<rect x="28" y="26" width="48" height="42" rx="10" fill="#e5f2f4" class="badge"/>
<text x="52" y="54" text-anchor="middle" class="label accent">05</text>
<text x="92" y="52" class="title">Copier, déplacer, supprimer</text>
<text x="92" y="82" class="subtitle">Observer ce qui reste après chaque commande.</text>
<text x="65" y="128" class="small" text-anchor="start">COMMANDE</text>
<text x="285" y="128" class="small" text-anchor="start">AVANT</text>
<text x="625" y="128" class="small" text-anchor="start">APRÈS</text>
<rect x="40" y="152" width="920" height="107" rx="14" class="box"/>
<text x="60" y="194" class="mono" text-anchor="start">cp a.txt b.txt</text>
<text x="285" y="194" class="mono" text-anchor="start">a.txt</text>
<path d="M460 187 L590 187" class="line" marker-end="url(#arrow)"/>
<text x="625" y="194" class="mono" text-anchor="start">a.txt + b.txt</text>
<text x="625" y="231" class="small" text-anchor="start">La source reste présente.</text>
<rect x="40" y="288" width="920" height="107" rx="14" class="box"/>
<text x="60" y="330" class="mono" text-anchor="start">mv a.txt b.txt</text>
<text x="285" y="330" class="mono" text-anchor="start">a.txt</text>
<path d="M460 323 L590 323" class="line" marker-end="url(#arrow)"/>
<text x="625" y="330" class="mono" text-anchor="start">b.txt</text>
<text x="625" y="367" class="small" text-anchor="start">Le fichier porte le nouveau nom.</text>
<rect x="40" y="424" width="920" height="107" rx="14" class="box"/>
<text x="60" y="466" class="mono" text-anchor="start">rm a.txt</text>
<text x="285" y="466" class="mono" text-anchor="start">a.txt</text>
<path d="M460 459 L590 459" class="line" marker-end="url(#arrow)"/>
<text x="625" y="466" class="mono" text-anchor="start">Aucun fichier a.txt</text>
<text x="625" y="503" class="small" text-anchor="start">Pas de passage par la corbeille.</text>
<text x="40" y="568" class="small" text-anchor="start">Exemples indépendants : b.txt n’existe pas au départ. Vérifier la cible avant toute suppression.</text>
</svg>
