<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title description">
<title id="title">Se repérer dans les chemins</title><desc id="description">Le chemin absolu part de / ; le chemin relatif part de votre position actuelle.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="#006575" class="arrow-fill"/></marker></defs>
<style>
text { font-family:'Segoe UI',Arial,sans-serif; fill:#182d3e; }
.title {font-size:28px;font-weight:750} .subtitle {font-size:18px;fill:#455d70}
.label {font-size:22px;font-weight:700} .body {font-size:20px} .small {font-size:17px;fill:#455d70}
.mono {font-family:Consolas,'DejaVu Sans Mono',monospace;font-size:20px} .accent {fill:#006575}
.box {fill:#fff;stroke:#8196a6;stroke-width:1.5} .soft {fill:#e5f2f4;stroke:#006575;stroke-width:1.5}
.line {fill:none;stroke:#006575;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-color-scheme:dark) {
.background {fill:#101923} .badge {fill:#243b4c} text {fill:#edf5fb}
.subtitle,.small {fill:#b7c9d8} .accent,.arrow-fill {fill:#72dfeb}
.box {fill:#192936;stroke:#587488} .soft {fill:#243b4c;stroke:#72dfeb} .line {stroke:#72dfeb}
}
</style>
<rect width="1000" height="600" rx="20" fill="#f4f7fa" class="background"/>
<rect x="28" y="26" width="48" height="42" rx="10" fill="#e5f2f4" class="badge"/>
<text x="52" y="54" text-anchor="middle" class="label accent">04</text>
<text x="92" y="52" class="title">Se repérer dans les chemins</text>
<text x="92" y="82" class="subtitle">Le chemin absolu part de / ; le chemin relatif part de votre position actuelle.</text>
<rect x="55" y="126" width="180" height="65" rx="14" class="box"/>
<text x="75" y="160" class="label" text-anchor="start">/</text>
<rect x="95" y="212" width="180" height="65" rx="14" class="box"/>
<text x="115" y="246" class="label" text-anchor="start">home</text>
<rect x="135" y="298" width="210" height="65" rx="14" class="soft"/>
<text x="155" y="332" class="label" text-anchor="start">stagiaire</text>
<rect x="175" y="414" width="220" height="65" rx="14" class="box"/>
<text x="195" y="448" class="label" text-anchor="start">formation</text>
<path d="M75 191 V244 H89 M115 277 V330 H129 M155 363 V446 H169" class="line"/>
<text x="155" y="392" class="small" text-anchor="start">Vous êtes ici : /home/stagiaire</text>
<rect x="460" y="145" width="485" height="112" rx="14" class="box"/>
<text x="480" y="179" class="label" text-anchor="start">Chemin absolu</text>
<text x="480" y="210" class="body" text-anchor="start">cd /home/stagiaire/formation</text>
<rect x="460" y="290" width="485" height="112" rx="14" class="soft"/>
<text x="480" y="324" class="label" text-anchor="start">Chemin relatif depuis stagiaire</text>
<text x="480" y="355" class="body" text-anchor="start">cd formation</text>
<text x="480" y="449" class="mono" text-anchor="start">cd .. → remonte au dossier parent</text>
<text x="480" y="489" class="mono" text-anchor="start">cd ou cd ~ → dossier personnel</text>
<text x="40" y="568" class="small" text-anchor="start">~ désigne le dossier personnel. Le dossier courant est désigné par un point : .</text>
</svg>
