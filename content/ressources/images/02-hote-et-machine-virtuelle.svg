<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title description">
<title id="title">Comprendre la machine virtuelle</title><desc id="description">Le système hôte et le système invité sont deux environnements distincts.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="#006575" class="arrow-fill"/></marker></defs>
<style>
text { font-family:'Segoe UI',Arial,sans-serif; fill:#182d3e; }
.title {font-size:28px;font-weight:750} .subtitle {font-size:18px;fill:#455d70}
.label {font-size:22px;font-weight:700} .body {font-size:20px} .small {font-size:17px;fill:#455d70}
.mono {font-family:Consolas,'DejaVu Sans Mono',monospace;font-size:20px} .accent {fill:#006575}
.box {fill:#fff;stroke:#8196a6;stroke-width:1.5} .soft {fill:#e5f2f4;stroke:#006575;stroke-width:1.5}
.line {fill:none;stroke:#006575;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-color-scheme:dark) {
.background {fill:#101923} .badge {fill:#243b4c} text {fill:#edf5fb}
.subtitle,.small {fill:#b7c9d8} .accent,.arrow-fill {fill:#72dfeb}
.box {fill:#192936;stroke:#587488} .soft {fill:#243b4c;stroke:#72dfeb} .line {stroke:#72dfeb}
}
</style>
<rect width="1000" height="600" rx="20" fill="#f4f7fa" class="background"/>
<rect x="28" y="26" width="48" height="42" rx="10" fill="#e5f2f4" class="badge"/>
<text x="52" y="54" text-anchor="middle" class="label accent">02</text>
<text x="92" y="52" class="title">Comprendre la machine virtuelle</text>
<text x="92" y="82" class="subtitle">Le système hôte et le système invité sont deux environnements distincts.</text>
<rect x="40" y="116" width="920" height="405" rx="14" class="box"/>
<text x="60" y="150" class="label" text-anchor="start">PC physique — système hôte</text>
<text x="60" y="181" class="body" text-anchor="start">Windows, Linux ou macOS : il continue de fonctionner.</text>
<rect x="80" y="218" width="840" height="270" rx="14" class="soft"/>
<text x="100" y="252" class="label" text-anchor="start">VirtualBox — logiciel de virtualisation</text>
<rect x="120" y="278" width="760" height="177" rx="14" class="box"/>
<text x="140" y="312" class="label" text-anchor="start">Machine virtuelle — système invité Debian</text>
<text x="140" y="343" class="body" text-anchor="start">Son propre système, ses comptes et ses fichiers</text>
<text x="140" y="370" class="body" text-anchor="start">RAM et processeur partagés avec le PC physique</text>
<text x="140" y="397" class="body" text-anchor="start">Disque virtuel : un fichier VDI sur le disque de l’hôte</text>
<text x="40" y="568" class="small" text-anchor="start">Pour revenir à un état antérieur : restaurer un instantané créé auparavant. Redémarrer ne suffit pas.</text>
</svg>
