<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title description">
<title id="title">Les grands repères de l’arborescence</title><desc id="description">Tous les chemins partent d’une seule racine : /.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="#006575" class="arrow-fill"/></marker></defs>
<style>
text { font-family:'Segoe UI',Arial,sans-serif; fill:#182d3e; }
.title {font-size:28px;font-weight:750} .subtitle {font-size:18px;fill:#455d70}
.label {font-size:22px;font-weight:700} .body {font-size:20px} .small {font-size:17px;fill:#455d70}
.mono {font-family:Consolas,'DejaVu Sans Mono',monospace;font-size:20px} .accent {fill:#006575}
.box {fill:#fff;stroke:#8196a6;stroke-width:1.5} .soft {fill:#e5f2f4;stroke:#006575;stroke-width:1.5}
.line {fill:none;stroke:#006575;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-color-scheme:dark) {
.background {fill:#101923} .badge {fill:#243b4c} text {fill:#edf5fb}
.subtitle,.small {fill:#b7c9d8} .accent,.arrow-fill {fill:#72dfeb}
.box {fill:#192936;stroke:#587488} .soft {fill:#243b4c;stroke:#72dfeb} .line {stroke:#72dfeb}
}
</style>
<rect width="1000" height="600" rx="20" fill="#f4f7fa" class="background"/>
<rect x="28" y="26" width="48" height="42" rx="10" fill="#e5f2f4" class="badge"/>
<text x="52" y="54" text-anchor="middle" class="label accent">06</text>
<text x="92" y="52" class="title">Les grands repères de l’arborescence</text>
<text x="92" y="82" class="subtitle">Tous les chemins partent d’une seule racine : /.</text>
<rect x="375" y="115" width="250" height="70" rx="14" class="soft"/>
<text x="395" y="149" class="label" text-anchor="start">/ — racine</text>
<text x="500" y="224" class="body" text-anchor="middle">Quelques chemins à connaître depuis la racine</text>
<rect x="55" y="255" width="250" height="100" rx="14" class="box"/>
<text x="75" y="289" class="label" text-anchor="start">/home</text>
<text x="75" y="320" class="body" text-anchor="start">Documents personnels</text>
<rect x="375" y="255" width="250" height="100" rx="14" class="box"/>
<text x="395" y="289" class="label" text-anchor="start">/etc</text>
<text x="395" y="320" class="body" text-anchor="start">Configuration</text>
<rect x="695" y="255" width="250" height="100" rx="14" class="box"/>
<text x="715" y="289" class="label" text-anchor="start">/var/log</text>
<text x="715" y="320" class="body" text-anchor="start">Journaux système</text>
<rect x="55" y="407" width="250" height="100" rx="14" class="box"/>
<text x="75" y="441" class="label" text-anchor="start">/usr/bin</text>
<text x="75" y="472" class="body" text-anchor="start">Commandes</text>
<rect x="375" y="407" width="250" height="100" rx="14" class="box"/>
<text x="395" y="441" class="label" text-anchor="start">/dev</text>
<text x="395" y="472" class="body" text-anchor="start">Périphériques</text>
<rect x="695" y="407" width="250" height="100" rx="14" class="box"/>
<text x="715" y="441" class="label" text-anchor="start">/tmp</text>
<text x="715" y="472" class="body" text-anchor="start">Fichiers temporaires</text>
<text x="500" y="387" class="small" text-anchor="middle">Exemple : /var/log est le dossier log dans /var</text>
<text x="40" y="568" class="small" text-anchor="start">Repères simplifiés. /root est le dossier personnel de root ; ce n’est pas la racine /.</text>
</svg>
