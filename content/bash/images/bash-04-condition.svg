<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="title"><title id="title">Une condition choisit une seule branche</title><rect width="1000" height="330" rx="18" fill="#f4f8fc"/><g font-family="Segoe UI,sans-serif" fill="#162c3d"><text x="30" y="40" font-size="24" font-weight="700">Une question, deux chemins possibles</text><path d="M500 65 620 112 500 159 380 112Z" fill="white" stroke="#176e78" stroke-width="2"/><text x="500" y="109" text-anchor="middle" font-size="17">Le fichier</text><text x="500" y="132" text-anchor="middle" font-size="17">existe-t-il ?</text><path d="M380 112H260V180M620 112H740V180" fill="none" stroke="#176e78" stroke-width="2"/><text x="285" y="100" font-size="17" font-weight="700">VRAI</text><text x="665" y="100" font-size="17" font-weight="700">FAUX</text><rect x="70" y="180" width="380" height="82" rx="12" fill="white" stroke="#176e78"/><rect x="550" y="180" width="380" height="82" rx="12" fill="white" stroke="#8b5b11"/><text x="260" y="215" text-anchor="middle" font-size="20" font-weight="700">Lire le fichier</text><text x="260" y="242" text-anchor="middle" font-size="16">Branche then</text><text x="740" y="215" text-anchor="middle" font-size="20" font-weight="700">Expliquer le problème</text><text x="740" y="242" text-anchor="middle" font-size="16">Branche else</text><text x="500" y="305" text-anchor="middle" font-size="18">Une seule branche est exécutée pour ce test.</text></g></svg>