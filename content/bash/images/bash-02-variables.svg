<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="title"><title id="title">Une valeur, un nom, une utilisation</title><rect width="1000" height="240" rx="18" fill="#f4f8fc"/><text x="30" y="43" font-family="Segoe UI,sans-serif" font-size="24" font-weight="700" fill="#162c3d">Une valeur, un nom, une utilisation</text><rect x="24" y="78" width="218" height="122" rx="12" fill="white" stroke="#a4bdc8"/><text x="40" y="110" font-family="Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#176e78">ÉTAPE 1</text><text x="40" y="142" font-family="Segoe UI,sans-serif" font-size="19" font-weight="700" fill="#162c3d">prenom=&quot;Mila&quot;</text><text x="40" y="174" font-family="Segoe UI,sans-serif" font-size="14" fill="#40566a">Affecter une valeur</text><path d="M247 140h17m-6-6 6 6-6 6" fill="none" stroke="#176e78" stroke-width="2"/><rect x="269" y="78" width="218" height="122" rx="12" fill="white" stroke="#a4bdc8"/><text x="285" y="110" font-family="Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#176e78">ÉTAPE 2</text><text x="285" y="142" font-family="Segoe UI,sans-serif" font-size="19" font-weight="700" fill="#162c3d">prenom</text><text x="285" y="174" font-family="Segoe UI,sans-serif" font-size="14" fill="#40566a">Le nom de la variable</text><path d="M492 140h17m-6-6 6 6-6 6" fill="none" stroke="#176e78" stroke-width="2"/><rect x="514" y="78" width="218" height="122" rx="12" fill="white" stroke="#a4bdc8"/><text x="530" y="110" font-family="Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#176e78">ÉTAPE 3</text><text x="530" y="142" font-family="Segoe UI,sans-serif" font-size="19" font-weight="700" fill="#162c3d">&quot;$prenom&quot;</text><text x="530" y="174" font-family="Segoe UI,sans-serif" font-size="14" fill="#40566a">Lire la valeur en un argument</text><path d="M737 140h17m-6-6 6 6-6 6" fill="none" stroke="#176e78" stroke-width="2"/><rect x="759" y="78" width="218" height="122" rx="12" fill="white" stroke="#a4bdc8"/><text x="775" y="110" font-family="Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#176e78">ÉTAPE 4</text><text x="775" y="142" font-family="Segoe UI,sans-serif" font-size="19" font-weight="700" fill="#162c3d">Bonjour Mila</text><text x="775" y="174" font-family="Segoe UI,sans-serif" font-size="14" fill="#40566a">Utiliser la valeur</text></svg>