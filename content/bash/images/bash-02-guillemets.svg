<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="352" viewBox="0 0 1000 352" role="img" aria-labelledby="title desc"><title id="title">Ce que echo reçoit vraiment</title><desc id="desc">Pour station égale Orion espaces Nord : sans guillemets echo reçoit deux arguments Orion et Nord et affiche Orion Nord avec un seul espace ; entre guillemets doubles echo reçoit un seul argument et affiche la valeur exacte ; entre guillemets simples echo reçoit le texte dollar station et l affiche tel quel.</desc><rect width="1000" height="352" rx="18" fill="#f4f8fc"/><text x="30" y="40" font-family="Segoe UI,sans-serif" font-size="23" font-weight="700" fill="#162c3d">Ce que <tspan font-family="Consolas,monospace">echo</tspan> reçoit vraiment</text><text x="30" y="62" font-family="Consolas,monospace" font-size="14" fill="#40566a">station=&quot;Orion    Nord&quot;</text>

<text x="30" y="92" font-family="Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#176e78" letter-spacing="1">TU ÉCRIS</text><text x="326" y="92" font-family="Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#176e78" letter-spacing="1">CE QUE BASH PASSE À ECHO</text><text x="700" y="92" font-family="Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#176e78" letter-spacing="1">AFFICHAGE</text><path d="M24 102h952" stroke="#a4bdc8" stroke-width="1"/>

<text x="30" y="134" font-family="Consolas,monospace" font-size="15" fill="#162c3d">echo $station</text><text x="30" y="155" font-family="Segoe UI,sans-serif" font-size="12" fill="#b87913">sans guillemets</text><path d="M290 129h20m-7-6 7 6-7 6" fill="none" stroke="#a4bdc8" stroke-width="2"/><rect x="326" y="114" width="86" height="28" rx="7" fill="#fdf0e0" stroke="#b87913"/><text x="340" y="133" font-family="Consolas,monospace" font-size="14" fill="#162c3d">Orion</text><rect x="420" y="114" width="78" height="28" rx="7" fill="#fdf0e0" stroke="#b87913"/><text x="434" y="133" font-family="Consolas,monospace" font-size="14" fill="#162c3d">Nord</text><text x="326" y="158" font-family="Segoe UI,sans-serif" font-size="12" fill="#40566a">2 arguments : la valeur a été découpée</text><path d="M655 129h20m-7-6 7 6-7 6" fill="none" stroke="#a4bdc8" stroke-width="2"/><rect x="700" y="114" width="200" height="28" rx="7" fill="#162c3d"/><text x="712" y="133" font-family="Consolas,monospace" font-size="14" fill="#ffffff">Orion Nord</text><text x="700" y="158" font-family="Segoe UI,sans-serif" font-size="12" fill="#b87913">un seul espace : perdu</text>
<path d="M24 176h952" stroke="#a4bdc8" stroke-width="1"/>

<text x="30" y="208" font-family="Consolas,monospace" font-size="15" fill="#162c3d">echo &quot;$station&quot;</text><text x="30" y="229" font-family="Segoe UI,sans-serif" font-size="12" fill="#176e78">guillemets doubles</text><path d="M290 203h20m-7-6 7 6-7 6" fill="none" stroke="#a4bdc8" stroke-width="2"/><rect x="326" y="188" width="172" height="28" rx="7" fill="#eaf4f5" stroke="#176e78"/><text x="340" y="207" font-family="Consolas,monospace" font-size="14" fill="#162c3d">Orion    Nord</text><text x="326" y="232" font-family="Segoe UI,sans-serif" font-size="12" fill="#40566a">1 argument : la valeur exacte</text><path d="M655 203h20m-7-6 7 6-7 6" fill="none" stroke="#a4bdc8" stroke-width="2"/><rect x="700" y="188" width="200" height="28" rx="7" fill="#162c3d"/><text x="712" y="207" font-family="Consolas,monospace" font-size="14" fill="#ffffff">Orion    Nord</text><text x="700" y="232" font-family="Segoe UI,sans-serif" font-size="12" fill="#40566a">espaces conservés</text>
<path d="M24 250h952" stroke="#a4bdc8" stroke-width="1"/>

<text x="30" y="282" font-family="Consolas,monospace" font-size="15" fill="#162c3d">echo '$station'</text><text x="30" y="303" font-family="Segoe UI,sans-serif" font-size="12" fill="#176e78">guillemets simples</text><path d="M290 277h20m-7-6 7 6-7 6" fill="none" stroke="#a4bdc8" stroke-width="2"/><rect x="326" y="262" width="126" height="28" rx="7" fill="#eaf4f5" stroke="#176e78"/><text x="340" y="281" font-family="Consolas,monospace" font-size="14" fill="#162c3d">$station</text><text x="326" y="306" font-family="Segoe UI,sans-serif" font-size="12" fill="#40566a">1 argument : le texte, non lu</text><path d="M655 277h20m-7-6 7 6-7 6" fill="none" stroke="#a4bdc8" stroke-width="2"/><rect x="700" y="262" width="200" height="28" rx="7" fill="#162c3d"/><text x="712" y="281" font-family="Consolas,monospace" font-size="14" fill="#ffffff">$station</text><text x="700" y="306" font-family="Segoe UI,sans-serif" font-size="12" fill="#40566a">aucun remplacement</text></svg>
