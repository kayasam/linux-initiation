name: Deploy Linux Initiation to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify quiz balance, random order and theme contrast
        run: node scripts/check-learning-ui.mjs
      - name: Verify introduction interactions and colors
        run: node scripts/check-introduction.mjs
      - name: Verify permissions laboratory
        run: node scripts/check-permissions.mjs
      - name: Play all Orion missions and verify the terminal UI
        run: |
          if ! command -v nano >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y nano
          fi
          python scripts/validate-orion-game.py
      - run: node scripts/fix-quartz-graph.mjs
      - run: node quartz/bootstrap-cli.mjs build
      - name: Copy downloads and verify local links
        run: python scripts/publish-assets.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
